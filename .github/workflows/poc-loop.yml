name: AI Development Loop

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  ai-development-loop:
    if: github.event.label.name == 'ai-task'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          if [ -f package.json ]; then npm install; fi

      - name: Install Gemini CLI
        run: npm install -g @google/gemini-cli

      - name: Verify pipeline script exists
        run: |
          if [ ! -f ".github/scripts/run-pipeline.sh" ]; then
            echo "::error::run-pipeline.sh がリポジトリに見つかりません。コミット/pushされているか確認してください。"
            exit 1
          fi

      - name: Make pipeline script executable
        run: chmod +x .github/scripts/run-pipeline.sh

      - name: Execute AI Loop Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          MAX_ATTEMPTS: 3
        run: .github/scripts/run-pipeline.sh
